<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and span</title>
    <style>
        .d1{
            border: 3px solid;
            background-color: brown;
        }
        .d2{
            border: 2px solid;
            background-color: aqua;
        }
        .d3{
            border: 2px solid;
            height: 100px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="d1">
        hello div
    </div>
    <br>    
    <span class="d1"> hello span</span>
    <br>
    <div class="d1">
        hii
        <div class="d2">
            hello div2
        </div>
        bye
    </div>
    <br>
    <span>hi
        <span>span</span>
        bye
    </span>
    <br>
    <div class="d1">
        hello    
        <span class="d2">span</span>
        bye
    </div>
    <br>
        <div class="d3">
        hello    
        bye
    </div>
    <br>
    <span class="d3">span</span>
    </body>
</html>
