<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      #d1{
        width: 50%;
      }
    </style>
</head>
<body>
    <form action="">
        <label for="">Name</label>
        <input type="text" name="" id="" autofocus placeholder="Enter your name"><br>

        <label for="">Phone</label>
        <input type="tel" name="" id="" minlength="10" maxlength="12"><br>

        <label for="">Age</label>
        <input type="number" name="" id="" min="1" max="120"><br>

        <label for="">Hidden</label>
        <input type="text" name="" id="" hidden><br>

        <label for="">Auto complete</label>
        <input type="text" name="" id="" value="Html" readonly><br>

        <label for="">autofocus</label>
        <input type="text" name="" id="" autofocus><br>

        <label for="">Disabled</label>
        <input type="text" name="" id="" disabled><br>

        <label for="">Email<sup style="color: red;">*</sup></label>
        <input type="email" name="" id="" required><br>

        <label for="">password</label>
        
        <input type="password" name="" id="" pattern="[a-z]{8}">
        <input type="submit" name="" id="">
    </form>

    <form action="">
      <select name="" id="">
        <option value="">Stream</option>
        <option value="">cse</option>
        <option value="">sse</option>
        <option value="">eee</option>
      </select><br>

      <input type="text" list="country">
      <datalist id="country">
        <option value="Mumbai">India</option>
        <option value="United State">United State</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="Canada">Canada</option>
        <option value="Russia">Russia</option>
      </datalist><br>
      <textarea name="" id="" col="10" row="'5"></textarea><br>
      <input type="submit" name="" id="" >
      <input type="submit" value="Singup">
      <button>Register</button>
      <button>Login</button>
    </form>

    <fieldset id="d1">
      <legend align="center">Login</legend>
      <form action="">
        <label for="">Name</label>
        <input type="text" name="" id="" autofocus
        placeholder="enter your name"><br>
      </form>
    </fieldset>
</body>
</html>
